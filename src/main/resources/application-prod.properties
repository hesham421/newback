# =====================================================================
# ERP System — PROD profile (container / deployment)
# Activated by the Dockerfile's --spring.profiles.active=prod. All secrets
# and connection details MUST come from the environment — there are no
# localhost/dev fallbacks here on purpose, so a misconfigured deploy fails
# fast and loud instead of silently pointing at a dev default.
# =====================================================================

# --- Datasource (PostgreSQL) — required from env ---------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis (cache) — required from env -------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Mail — required from env ----------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Frontend — required from env -------------------------------------
app.frontend-url=${FRONTEND_URL}

# --- Prod hardening ---------------------------------------------------
spring.jpa.show-sql=false
management.endpoint.health.show-details=never

# --- Logging ----------------------------------------------------------
logging.level.root=INFO
logging.level.com.erp=INFO

# ── Secrets: REQUIRED in prod, no fallback ──────────────────────────────────
# The base application.properties gives these a dev-only default so a local run
# needs no environment at all. That default is harmless there and dangerous
# here: without these two lines a prod deploy that forgets JWT_SECRET boots
# SILENTLY on a secret published in this repository, and every token it signs
# is forgeable by anyone who has read it. Re-declaring them WITHOUT a fallback
# makes Spring fail to start instead — the only safe failure mode for a secret.
app.jwt.secret=${JWT_SECRET}
file.access-token.secret=${FILE_ACCESS_TOKEN_SECRET}
