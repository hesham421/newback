# =====================================================================
# ERP System — base configuration (common to every profile)
# Profile-specific values (datasource, redis, mail, logging) live in
# application-dev.properties / application-prod.properties. Activate a
# profile with SPRING_PROFILES_ACTIVE=dev (see .env.example) or, in Docker,
# --spring.profiles.active=prod (see Dockerfile).
# =====================================================================

spring.application.name=erp-system

# --- Active profile ---------------------------------------------------
# The datasource lives in the profile files, so a run with NO profile active
# fails at startup with "Failed to configure a DataSource: 'url' attribute is
# not specified". That used to happen to every `mvn spring-boot:run` from a
# shell that had not sourced .env. `spring.profiles.default` applies ONLY when
# nothing else set a profile, so it cannot shadow prod: the Dockerfile passes
# --spring.profiles.active=prod and an explicit profile always wins over this.
spring.profiles.default=dev

# --- Server -----------------------------------------------------------
# 7272 is the contract: Docker EXPOSE, OpenApiConfig's default, and the
# TestSprite governance all assume it. Do not change without updating those.
server.port=7272
server.shutdown=graceful

# --- Datasource (PostgreSQL) -----------------------------------------
# Defined HERE, in the profile-independent base, on purpose. These used to live
# only in application-dev.properties, so anything that started without a profile
# — `mvn spring-boot:run` from a shell that had not sourced .env, `java -jar`,
# an IDE run configuration — died with "Failed to configure a DataSource: 'url'
# attribute is not specified and no embedded datasource could be configured".
# The defaults match docker/docker-compose.yml, so a clean checkout + `docker
# compose up -d` runs with zero environment variables set.
# application-prod.properties overrides all three with no-default ${DB_URL} etc.,
# so a production deploy still fails fast rather than falling back to localhost.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Redis (cache) ----------------------------------------------------
# Base defaults, same reasoning as the datasource above. prod overrides the host
# with a no-default ${REDIS_HOST}.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Mail (SMTP) ------------------------------------------------------
# spring.mail.host MUST be set outside any profile: it is what makes Spring
# create the JavaMailSender bean, and NOTIF's DefaultChannelProvider takes that
# bean as a constructor argument. With the host defined only in a profile, a
# profile-less start failed with "required a bean of type 'JavaMailSender' that
# could not be found" — the same class of failure as the missing datasource.
# Credentials stay empty by default (there is no sane default for them): mail
# then reports DOWN in /actuator/health until MAIL_USERNAME / MAIL_PASSWORD are
# supplied, which is the intended local behaviour. prod overrides both as required.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JPA / Hibernate --------------------------------------------------
# HibernateJpaAutoConfiguration is excluded in ErpMainApplication; the custom
# JpaConfig reads these placeholders (see JpaConfig's @Value defaults).
# Schema is owned by Flyway, so Hibernate never generates DDL (ddl-auto=none).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (DB migrations) ------------------------------------------
# Migrations live in src/main/resources/db/migration (classpath:db/migration).
# baseline-on-migrate lets Flyway adopt a non-empty database cleanly; with no
# migration files yet (clean start) Flyway simply finds nothing and no-ops.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Actuator (health only — used by the Docker healthcheck & TestSprite) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
# Do not let an optional cache backend being down mark the whole app unhealthy.
management.health.redis.enabled=false

# --- Cache (Redis-backed when a Redis is reachable) -------------------
spring.cache.type=redis

# --- Internationalization (i18n/messages*.properties) ----------------
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- OpenAPI / Swagger UI --------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- JWT (consumed by the SEC module) --------------------------------
# Access-token TTL drives LoginResponse.expiresIn. There is no refresh token:
# a client logs in again when the access token expires.
app.jwt.secret=${JWT_SECRET:dev-only-secret-minimum-256-bits-long-do-not-use-in-prod}
app.jwt.expiration-ms=3600000

# --- FILE access token (RULE-FILE-003 — AES/GCM download token, separate from JWT) --
# Secret is SHA-256-derived into a 256-bit AES key by FileAccessTokenDomainService.
file.access-token.secret=${FILE_ACCESS_TOKEN_SECRET:dev-only-file-token-secret-minimum-256-bits-do-not-use-in-prod}

# --- Multipart uploads (API-FILE-001) --------------------------------
# Set GENEROUSLY above the RULE-FILE-001 business limits (content ≤5MB, request ≤10MB) so the
# domain size check (FileValidationDomainService → ERR-0001, 413) is what rejects oversize files,
# not Spring's own MaxUploadSizeExceededException.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# --- JSON (global Jackson policy — no per-controller ObjectMapper) ---
# Jackson 3 (Boot 4) removed SerializationFeature.WRITE_DATES_AS_TIMESTAMPS; dates
# now serialize as ISO-8601 strings by default, so no property is needed.
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Password-reset link (SEC) ---------------------------------------
# Route on app.frontend-url that hosts the reset screen. PasswordResetService appends
# ?token=<raw token> and mails the result as a one-click button. Profile-independent because the
# route is a property of the UI, not of the environment — override only if the UI moves it.
app.password-reset-path=${PASSWORD_RESET_PATH:/password-reset/complete}

# Origin the emailed links point at. Only `application-dev.properties` used to
# carry a default, so a jar started WITHOUT a profile left this blank and
# `PasswordResetService.buildActionLink` logged its own warning and mailed a
# relative link no mail client can open. The default belongs here, where every
# profile inherits it; `application-prod.properties` still overrides it with a
# required `${FRONTEND_URL}`, so production cannot accidentally ship localhost.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
