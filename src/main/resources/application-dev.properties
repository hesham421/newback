# =====================================================================
# ERP System — DEV profile (local development)
# Activated by SPRING_PROFILES_ACTIVE=dev (.env.example). Every value falls
# back to the docker/docker-compose.yml defaults, so `docker compose up -d`
# then running the app needs zero .env edits.
# =====================================================================

# --- Datasource (PostgreSQL) -----------------------------------------
# Intentionally NOT repeated here. The dev values ARE the base defaults now and
# live in application.properties, so the app connects with or without a profile.
# Override per-machine with DB_URL / DB_USERNAME / DB_PASSWORD in .env.

# --- Redis / Mail / frontend URL --------------------------------------
# Intentionally NOT repeated here — the dev values ARE the base defaults and
# live in application.properties, so the app starts with or without a profile.
# Override per-machine via .env (REDIS_HOST, MAIL_USERNAME, FRONTEND_URL, ...).

# --- Dev conveniences -------------------------------------------------
spring.jpa.show-sql=true
management.endpoint.health.show-details=always

# --- Logging ----------------------------------------------------------
logging.level.com.erp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
