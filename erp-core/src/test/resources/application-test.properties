# =====================================================================
# erp-core — TEST profile (activated by com.erp.testsupport.AbstractIntegrationTest)
# No localhost PostgreSQL / Redis / SMTP is needed. The datasource is NOT set here:
# AbstractIntegrationTest supplies it (Testcontainers @ServiceConnection, or the embedded
# PostgreSQL fallback via spring.datasource.* dynamic properties).
# =====================================================================

# --- Schema: Flyway owns it, Hibernate never generates DDL -----------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# --- Cache: in-memory, no Redis ----------------------------------------
spring.cache.type=simple
# Boot auto-configures a StringRedisTemplate whenever spring-data-redis is on the classpath,
# whatever the spring.data.redis.* properties say. Excluding the Redis auto-configurations keeps
# that bean absent, so FILE's download tokens use the InMemoryDownloadTokenStore.
spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

# --- Mail: the JavaMailSender bean exists, but no server listens here ---
# Tests never send real mail; an EMAIL dispatch fails and is recorded as FAILED on NOTIF_LOG.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
management.health.mail.enabled=false

# --- erp-core settings (test-only values; erp.core.* since step 03) ----------
erp.core.security.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789a
erp.core.security.jwt.expiration-ms=3600000
erp.core.files.access-token-secret=test-only-file-access-token-secret-0123456789abcdef0123456789
erp.core.frontend.base-url=http://localhost:3000
erp.core.frontend.password-reset-path=/reset

# --- NOTIF asynchronous delivery (erp-core step 08) ---------------------------
# Production retries wait 2 s doubling to 32 s; tests keep the same 5 attempts with millisecond waits.
# The requeue job bean exists (no @EnableScheduling in tests, so it only runs when a test calls it).
erp.core.notif.retry.max-attempts=5
erp.core.notif.retry.initial-delay-ms=20
erp.core.notif.retry.multiplier=2.0
erp.core.notif.retry.max-delay-ms=80
erp.core.notif.requeue.enabled=true

# --- What application.properties used to provide (erp-core ships none since step 03) ---
spring.jpa.open-in-view=false
# Each cached test context keeps its own Hikari pool; the test database allows 100 connections (TestPostgres,
# CI's postgres:16). Hikari's default 10 per context left no headroom for one more context (tenant-maturity E
# review round 1); 4 per context covers a request transaction plus a REQUIRES_NEW and the async event workers.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Logging -------------------------------------------------------------
logging.level.root=WARN
