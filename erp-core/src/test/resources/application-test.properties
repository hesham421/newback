# =====================================================================
# ERP System — TEST profile (activated by com.erp.testsupport.AbstractIntegrationTest)
# No localhost PostgreSQL / Redis / SMTP is needed. The datasource is NOT set here:
# AbstractIntegrationTest supplies it (Testcontainers @ServiceConnection, or the embedded
# PostgreSQL fallback via spring.datasource.* dynamic properties).
# =====================================================================

# --- Schema: Flyway owns it, Hibernate never generates DDL -----------
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# --- Cache: in-memory, no Redis ----------------------------------------
spring.cache.type=simple
# Boot auto-configures a StringRedisTemplate whenever spring-data-redis is on the classpath,
# whatever the spring.data.redis.* properties say. Excluding the Redis auto-configurations keeps
# that bean absent, so FILE's download tokens use the InMemoryDownloadTokenStore.
spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

# --- Mail: the JavaMailSender bean exists, but no server listens here ---
# Tests never send real mail; an EMAIL dispatch fails and is recorded as FAILED on NOTIF_LOG.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
management.health.mail.enabled=false

# --- Secrets / URLs (test-only values) ----------------------------------
app.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789abcdef0123456789a
app.jwt.expiration-ms=3600000
file.access-token.secret=test-only-file-access-token-secret-0123456789abcdef0123456789
app.frontend-url=http://localhost:3000
app.password-reset-path=/reset

# --- Logging -------------------------------------------------------------
logging.level.root=WARN
