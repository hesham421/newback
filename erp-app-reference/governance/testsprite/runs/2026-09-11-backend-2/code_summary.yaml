version: "2"
type: backend
tech_stack:
  - Java 25
  - Spring Boot 4
  - Spring Security (stateless JWT — no HTTP Basic)
  - PostgreSQL
  - Flyway
  - Redis (caching)
  - springdoc-openapi
features:
  - name: SEC Authentication
    description: Login, self-service sign-up submission, and password-reset request/complete. The only public (pre-authentication) SEC endpoints — every other SEC endpoint requires Authorization Bearer <accessToken>. To authenticate for protected endpoints, POST {username, password} to /api/v1/sec/auth/login and read data.accessToken.
    files:
      - src/main/java/com/erp/sec/controller/AuthController.java
      - src/main/java/com/erp/sec/service/AuthService.java
      - src/main/java/com/erp/sec/service/PasswordResetService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/auth/login
        description: Login with username/password, returns JWT access token
        auth_required: false
        request_schema:
          body:
            username: string (required)
            password: string (required)
        response_schema:
          "200": ApiResponse<LoginResponse> — data.accessToken, data.tokenType, data.expiresIn
          "401": SEC-401-INVALID-CREDENTIALS — invalid credentials
      - method: POST
        path: /api/v1/sec/auth/signup
        description: Submit a sign-up request (does not create a User; creates a PENDING SignupRequest)
        auth_required: false
        request_schema:
          body:
            email: string (required, maxLength 255)
            fullNameAr: string (required, maxLength 200)
            fullNameEn: string (required, maxLength 200)
        response_schema:
          "200": ApiResponse<SignupRequestResponse> — data.statusCode=PENDING
          "409": SEC-409-SIGNUP-DUP — email already registered or pending
      - method: POST
        path: /api/v1/sec/auth/password-reset/request
        description: Request a password reset token by email (generic response whether or not the email exists)
        auth_required: false
        request_schema:
          body:
            email: string (required)
        response_schema:
          "200": ApiResponse<ConfirmationResponse> — generic confirmation, same shape regardless of email existence
      - method: POST
        path: /api/v1/sec/auth/password-reset/complete
        description: Complete a password reset using a token
        auth_required: false
        request_schema:
          body:
            token: string (required)
            newPassword: string (required)
        response_schema:
          "200": ApiResponse<ConfirmationResponse> — password updated
          "409": SEC-409-RESET-TOKEN-INVALID — token expired or already used
    depends_on: []

  - name: SEC Users
    description: Create, update, deactivate/reactivate users; assign roles to a user. All require a bearer token.
    files:
      - src/main/java/com/erp/sec/controller/UserController.java
      - src/main/java/com/erp/sec/service/UserService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/users
        description: Create a user directly (statusCode defaults ACTIVE)
        auth_required: true
        request_schema:
          body:
            username: string (required)
            email: string (required)
            fullNameAr: string (required)
            fullNameEn: string (required)
            password: string (required)
        response_schema:
          "200": ApiResponse<UserResponse>
          "409": SEC-409-USER-DUP — username/email already exists
      - method: POST
        path: /api/v1/sec/users/search
        description: Search users, paginated (filters on username, email, fullName, statusCode)
        auth_required: true
        request_schema:
          body: BaseSearchContractRequest — {page, size, sortField, sortDirection, filters}
        response_schema:
          "200": ApiResponse<Page<UserResponse>>
          "400": SEC-400-INVALID-SORT — unrecognized sortField
      - method: PUT
        path: /api/v1/sec/users/{id}
        description: Update a user
        auth_required: true
        response_schema:
          "200": ApiResponse<UserResponse>
          "404": SEC-404-USER
      - method: PUT
        path: /api/v1/sec/users/{id}/roles
        description: Assign one or more roles to a user (replaces the set); rejects SoD conflicts
        auth_required: true
        request_schema:
          body:
            roleIds: array<integer> (required)
        response_schema:
          "200": ApiResponse<UserResponse> — one UserRoleAssignment row per selected role
          "409": SEC-409-SOD-CONFLICT — user would hold two conflicting actions
      - method: DELETE
        path: /api/v1/sec/users/{id}
        description: Deactivate a user (statusCode=DISABLED) and terminate its active sessions
        auth_required: true
        response_schema:
          "200": ApiResponse<UserStatusResponse> — statusCode=DISABLED, active session terminated
          "404": SEC-404-USER
      - method: PATCH
        path: /api/v1/sec/users/{id}
        description: Reactivate a disabled user (statusCode=ACTIVE)
        auth_required: true
        response_schema:
          "200": ApiResponse<UserStatusResponse> — statusCode=ACTIVE
          "404": SEC-404-USER
    depends_on:
      - SEC Authentication

  - name: SEC Sign-up Requests
    description: Approve or reject a pending sign-up request; approval creates the User.
    files:
      - src/main/java/com/erp/sec/controller/SignupRequestController.java
      - src/main/java/com/erp/sec/service/SignupService.java
    endpoints:
      - method: PATCH
        path: /api/v1/sec/signup-requests/{id}
        description: Decide a pending sign-up request (APPROVE creates a User statusCode=ACTIVE and sets SignupRequest APPROVED; REJECT sets it REJECTED, no User created)
        auth_required: true
        request_schema:
          body:
            decision: string (required, "APPROVE" | "REJECT")
        response_schema:
          "200": ApiResponse<UserResponse | SignupRequestResponse>
          "404": SEC-404-SIGNUP
          "409": SEC-409-INVALID-TRANSITION — request not PENDING
    depends_on:
      - SEC Authentication

  - name: SEC Roles
    description: Create roles and search them.
    files:
      - src/main/java/com/erp/sec/controller/RoleController.java
      - src/main/java/com/erp/sec/service/RoleService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/roles
        description: Create a role
        auth_required: true
        response_schema:
          "200": ApiResponse<RoleResponse>
          "409": SEC-409-ROLE-DUP
      - method: POST
        path: /api/v1/sec/roles/search
        description: Search roles, paginated
        auth_required: true
        response_schema:
          "200": ApiResponse<Page<RoleResponse>>
    depends_on:
      - SEC Authentication

  - name: SEC Role Grants
    description: Grant/revoke module, screen, and action permissions on a role. Enforces cascading rule hierarchy (module -> screen -> action -> VIEW-before-other-actions) and cascade-revoke.
    files:
      - src/main/java/com/erp/sec/controller/RoleGrantController.java
      - src/main/java/com/erp/sec/service/RoleGrantService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/roles/{id}/modules
        description: Grant a module to a role
        auth_required: true
        response_schema:
          "200": ApiResponse<RoleModuleGrantResponse>
          "409": SEC-409-GRANT-DUP
      - method: DELETE
        path: /api/v1/sec/roles/{id}/modules/{moduleId}
        description: Revoke a module grant from a role — cascades to delete every dependent screen/action grant under that module
        auth_required: true
        response_schema:
          "200": ApiResponse<ModuleGrantRevokeResponse> — revokedScreenGrants, revokedActionGrants counts
          "404": SEC-404-GRANT
      - method: POST
        path: /api/v1/sec/roles/{id}/screens
        description: Grant a screen to a role — requires the role already holds the screen's module grant
        auth_required: true
        response_schema:
          "200": ApiResponse<RoleScreenGrantResponse>
          "409": SEC-409-NO-MODULE-GRANT — no module grant yet / SEC-409-GRANT-DUP
      - method: POST
        path: /api/v1/sec/roles/{id}/actions
        description: Grant an action to a role — requires the screen grant already exists; VIEW must be granted before any other action on that screen; rejects separation-of-duties conflicts
        auth_required: true
        response_schema:
          "200": ApiResponse<RoleActionGrantResponse>
          "409": SEC-409-NO-SCREEN-GRANT / SEC-409-NO-VIEW-GRANT / SEC-409-SOD-CONFLICT / SEC-409-GRANT-DUP
    depends_on:
      - SEC Roles
      - SEC Module Registry

  - name: SEC Module Registry
    description: Register modules/screens/actions into the permission catalog, and search the registry.
    files:
      - src/main/java/com/erp/sec/controller/RegistryController.java
      - src/main/java/com/erp/sec/service/RegistryService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/registry/modules
        description: Register a new module
        auth_required: true
        request_schema:
          body:
            code: string (required)
            nameAr: string (required)
            nameEn: string (required)
        response_schema:
          "200": ApiResponse<ModuleRegistryResponse>
          "409": SEC-409-MODULE-DUP
      - method: POST
        path: /api/v1/sec/registry/screens
        description: Register a screen under a registered module
        auth_required: true
        request_schema:
          body:
            moduleCode: string (required)
            pageCode: string (required)
            nameAr: string (required)
            nameEn: string (required)
        response_schema:
          "200": ApiResponse<ScreenRegistryResponse>
          "409": SEC-409-MODULE-NOT-REGISTERED / SEC-409-SCREEN-DUP
      - method: POST
        path: /api/v1/sec/registry/actions
        description: Register an action under a registered screen (permissionCode derived as PERM_<pageCode>_<actionCode>)
        auth_required: true
        request_schema:
          body:
            pageCode: string (required)
            actionCode: string (required)
            nameAr: string (required)
            nameEn: string (required)
        response_schema:
          "200": ApiResponse<ActionRegistryResponse>
          "409": SEC-409-SCREEN-NOT-REGISTERED / SEC-409-ACTION-DUP
      - method: POST
        path: /api/v1/sec/registry/search
        description: Search the module/screen/action registry, paginated
        auth_required: true
        response_schema:
          "200": ApiResponse<Page<RegistryRowResponse>>
    depends_on:
      - SEC Authentication

  - name: SEC Menu
    description: Effective navigation menu for the caller, scoped to their own granted modules/screens.
    files:
      - src/main/java/com/erp/sec/controller/MenuController.java
      - src/main/java/com/erp/sec/service/MenuService.java
    endpoints:
      - method: GET
        path: /api/v1/sec/menu
        description: Get the effective menu for the caller (self-scoped — no input; ungranted modules/screens never appear)
        auth_required: true
        response_schema:
          "200": ApiResponse<List<ModuleMenuResponse>>
    depends_on:
      - SEC Role Grants

  - name: SEC Security Dashboard
    description: Administrative dashboard with live-computed figures (recent activity, roles/permissions summary, onboarding funnel); widgets the caller lacks permission for are omitted.
    files:
      - src/main/java/com/erp/sec/controller/DashboardController.java
      - src/main/java/com/erp/sec/service/DashboardService.java
    endpoints:
      - method: GET
        path: /api/v1/sec/dashboard
        description: Get the security dashboard summary, computed live (no caching)
        auth_required: true
        response_schema:
          "200": ApiResponse<DashboardResponse> — recentActivity (last 10 AuditLogEntry), rolesPermissionsSummary.privilegedRoleCount, onboardingFunnel.stalledCount, activeSessions widget (omitted if caller lacks PERM_SEC_SESSIONS_VIEW)
    depends_on:
      - SEC Role Grants

  - name: SEC Audit Log
    description: Immutable audit trail of security events; searchable and exportable, never editable (no update/delete route exists).
    files:
      - src/main/java/com/erp/sec/controller/AuditLogController.java
      - src/main/java/com/erp/sec/service/AuditLogService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/audit-log/search
        description: Search the audit log by eventTypeCode/date range, paginated
        auth_required: true
        response_schema:
          "200": ApiResponse<Page<AuditLogEntryResponse>>
      - method: GET
        path: /api/v1/sec/audit-log/export
        description: Export the audit log matching the given filters as CSV
        auth_required: true
        response_schema:
          "200": text/csv — rows exactly match the filtered set's fields
    depends_on:
      - SEC Authentication

  - name: SEC Active Sessions
    description: List and force-terminate active login sessions.
    files:
      - src/main/java/com/erp/sec/controller/SessionController.java
      - src/main/java/com/erp/sec/service/SessionService.java
    endpoints:
      - method: POST
        path: /api/v1/sec/sessions/search
        description: List non-terminated sessions, paginated
        auth_required: true
        response_schema:
          "200": ApiResponse<Page<ActiveSessionResponse>> — only non-terminated sessions
      - method: DELETE
        path: /api/v1/sec/sessions/{id}
        description: Force-terminate a session; its token is no longer accepted afterward
        auth_required: true
        response_schema:
          "200": ApiResponse<SessionTerminationResponse> — terminatedAt/terminatedBy set
          "404": SEC-404-SESSION
          "409": SEC-409-ALREADY-TERMINATED
    depends_on:
      - SEC Authentication

  - name: CU Configuration
    description: Common Utils key/value configuration entries (cross-cutting library module, ROOT).
    files:
      - src/main/java/com/erp/cu/controller/ConfigurationController.java
    endpoints:
      - method: POST
        path: /api/v1/common/configurations
        description: Create a configuration entry
        auth_required: true
      - method: POST
        path: /api/v1/common/configurations/search
        description: Search configuration entries, paginated
        auth_required: true
      - method: GET
        path: /api/v1/common/configurations/{key}
        description: Get a configuration entry by key
        auth_required: true
      - method: PUT
        path: /api/v1/common/configurations/{key}
        description: Update a configuration entry by key
        auth_required: true
      - method: DELETE
        path: /api/v1/common/configurations/{key}
        description: Deactivate a configuration entry by key
        auth_required: true
    depends_on:
      - SEC Authentication

  - name: FILE Categories
    description: File-category management for the FILE module.
    files:
      - src/main/java/com/erp/file/controller/FileCategoryController.java
    endpoints:
      - method: POST
        path: /api/v1/files/categories
        description: Create a file category
        auth_required: true
      - method: POST
        path: /api/v1/files/categories/search
        description: Search file categories, paginated
        auth_required: true
      - method: GET
        path: /api/v1/files/categories/{id}
        description: Get a file category by id
        auth_required: true
      - method: PUT
        path: /api/v1/files/categories/{id}
        description: Update a file category
        auth_required: true
      - method: DELETE
        path: /api/v1/files/categories/{id}
        description: Deactivate a file category
        auth_required: true
    depends_on:
      - SEC Authentication

  - name: FILE Storage
    description: File upload/download/metadata management.
    files:
      - src/main/java/com/erp/file/controller/FileController.java
      - src/main/java/com/erp/file/controller/FileLookupController.java
    endpoints:
      - method: POST
        path: /api/v1/files
        description: Upload a file with metadata (multipart/form-data)
        auth_required: true
      - method: POST
        path: /api/v1/files/{id}/access-token
        description: Issue an access token for file download
        auth_required: true
      - method: GET
        path: /api/v1/files/download
        description: Download a file via access token
        auth_required: false
      - method: GET
        path: /api/v1/files/{id}
        description: Get file metadata by id
        auth_required: true
      - method: GET
        path: /api/v1/files
        description: List files
        auth_required: true
      - method: DELETE
        path: /api/v1/files/{id}
        description: Delete a file
        auth_required: true
      - method: GET
        path: /api/v1/files/lookups/{lookupKey}
        description: Get a lookup list by key
        auth_required: true
    depends_on:
      - SEC Authentication

  - name: NOTIF Dispatch and Templates
    description: Notification dispatch, channel, template and log management for the NOTIF module.
    files:
      - src/main/java/com/erp/notif/controller/DispatchController.java
      - src/main/java/com/erp/notif/controller/NotificationChannelController.java
      - src/main/java/com/erp/notif/controller/NotificationLogController.java
      - src/main/java/com/erp/notif/controller/NotificationTemplateController.java
      - src/main/java/com/erp/notif/controller/NotificationLookupController.java
    endpoints:
      - method: POST
        path: /api/v1/notifications/dispatch
        description: Dispatch a notification
        auth_required: true
      - method: POST
        path: /api/v1/notifications/channels
        description: Create a notification channel
        auth_required: true
      - method: POST
        path: /api/v1/notifications/channels/search
        description: Search notification channels, paginated
        auth_required: true
      - method: GET
        path: /api/v1/notifications/channels/{id}
        description: Get a notification channel by id
        auth_required: true
      - method: PUT
        path: /api/v1/notifications/channels/{id}
        description: Update a notification channel
        auth_required: true
      - method: DELETE
        path: /api/v1/notifications/channels/{id}
        description: Deactivate a notification channel
        auth_required: true
      - method: POST
        path: /api/v1/notifications/logs/search
        description: Search notification logs, paginated
        auth_required: true
      - method: GET
        path: /api/v1/notifications/logs/{id}
        description: Get a notification log by id
        auth_required: true
      - method: POST
        path: /api/v1/notifications/templates
        description: Create a notification template
        auth_required: true
      - method: POST
        path: /api/v1/notifications/templates/search
        description: Search notification templates, paginated
        auth_required: true
      - method: GET
        path: /api/v1/notifications/templates/{id}
        description: Get a notification template by id
        auth_required: true
      - method: PUT
        path: /api/v1/notifications/templates/{id}
        description: Update a notification template
        auth_required: true
      - method: DELETE
        path: /api/v1/notifications/templates/{id}
        description: Deactivate a notification template
        auth_required: true
      - method: GET
        path: /api/v1/notifications/lookups/{lookupKey}
        description: Get a lookup list by key
        auth_required: true
    depends_on:
      - SEC Authentication

known_limitations:
  - issue: TC-SEC-034/TC-SEC-035 exercise an in-process cross-module Spring interface (com.erp.sec.crossmodule.SecUserDirectoryApi), not an HTTP endpoint — not reachable via black-box API testing.
    location: src/main/java/com/erp/sec/crossmodule/SecUserDirectoryApi.java
    impact: These two governed test cases cannot be exercised by an HTTP-based test tool; they require an in-JVM caller.
  - issue: REQ-SEC-020 separation-of-duties conflicting-action pairs are declared empty in SEC v1 (deferred — see governance/modules/SEC/execution-state.json api_doc_gaps)
    location: src/main/java/com/erp/sec/service/RoleGrantService.java
    impact: SEC-409-SOD-CONFLICT (TC-SEC-020) cannot be triggered through SEC alone without a FIN-owned conflicting pair seeded; use the FIN entry-creator / period-close-approver pair if FIN is seeded, otherwise this scenario cannot be exercised end-to-end in SEC-only test data.
  - issue: Prior run (2026-09-11, invalidated) hit stale compiled classes under a live JVM, causing every /api/v1/sec/auth/* call to return a bare 500 INTERNAL_ERROR. The app has since been rebuilt and restarted fresh; login now returns 200 with a valid JWT and signup returns 201.
    location: N/A — environmental, not a code defect
    impact: None on current run; noted for context only.
